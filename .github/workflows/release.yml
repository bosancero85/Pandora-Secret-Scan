name: Build & Release Pandora Secret Scan

# Startet, wenn du einen Tag wie v0.2.0 pushst oder ein Release in GitHub anlegst.
# Zusätzlich manuell startbar: Actions -> Build & Release Pandora Secret Scan -> Run workflow
# (manueller Start baut nur; die fertigen Dateien liegen dann als "Artifacts" am Lauf, ein Release entsteht nur bei einem Tag)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# ---------- HIER ANPASSEN ----------
env:
  ENTRY_FILE: pandora_secret_scan.py
  APP_NAME: Pandora-Secret-Scan
  PYTHON_VERSION: "3.11"
  ICON_ICO: pandora_secret_scan_icon.ico
  ICON_PNG: pandora_secret_scan_icon.png
  ICON_PNG_256: pandora_secret_scan_icon_256.png
# -----------------------------------
# Die Dateinamen der fertigen Programme (Pandora-Secret-Scan-Win.exe, Pandora-Secret-Scan-Mac.dmg,
# Pandora-Secret-Scan-Linux.AppImage) müssen zu den Download-Links in index.html passen.

jobs:
  # ------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        shell: bash
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -e "$f" || { echo "::error::Datei/Ordner fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Import-Test (fängt Programmierfehler vor dem Bauen ab)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import pandora_secret_scan; print('Import ok')"

      - name: EXE bauen
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          pyinstaller --onefile --windowed --noconfirm \
            --name "Pandora-Secret-Scan-Win" \
            --icon "$ICON_ICO" \
            "$ENTRY_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: secretscan-windows
          path: dist/Pandora-Secret-Scan-Win.exe
          if-no-files-found: error

  # ------------------------------------------------------------
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        shell: bash
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -e "$f" || { echo "::error::Datei/Ordner fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Abhängigkeiten installieren
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Pillow wandelt das PNG-Icon für PyInstaller automatisch in .icns um
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Import-Test (fängt Programmierfehler vor dem Bauen ab)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import pandora_secret_scan; print('Import ok')"

      - name: App bauen
        shell: bash
        run: |
          pyinstaller --windowed --noconfirm \
            --name "$APP_NAME" \
            --icon "$ICON_PNG" \
            --osx-bundle-identifier "de.pandora.secretscan" \
            "$ENTRY_FILE"

      - name: DMG erstellen
        shell: bash
        run: |
          hdiutil create -volname "Pandora Secret Scan" \
            -srcfolder "dist/$APP_NAME.app" \
            -ov -format UDZO "Pandora-Secret-Scan-Mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: secretscan-macos
          path: Pandora-Secret-Scan-Mac.dmg
          if-no-files-found: error

  # ------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Startdatei und Icons prüfen
        run: |
          for f in "$ENTRY_FILE" "$ICON_ICO" "$ICON_PNG" "$ICON_PNG_256"; do
            test -e "$f" || { echo "::error::Datei/Ordner fehlt im Repo-Hauptordner: $f"; exit 1; }
          done

      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Import-Test (fängt Programmierfehler vor dem Bauen ab)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import pandora_secret_scan; print('Import ok')"

      - name: Binary bauen
        run: |
          pyinstaller --onefile --noconfirm \
            --name "$APP_NAME" \
            "$ENTRY_FILE"

      - name: AppImage zusammenstellen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin
          cp "dist/$APP_NAME" "AppDir/usr/bin/$APP_NAME"

          # Icon für Startmenü und Dateimanager
          cp "$ICON_PNG_256" AppDir/pandora-secret-scan.png
          cp "$ICON_PNG_256" AppDir/.DirIcon

          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$APP_NAME" "\$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/pandora-secret-scan.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Pandora Secret Scan
          Exec=$APP_NAME
          Icon=pandora-secret-scan
          Categories=Development;Security;Utility;
          EOF

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir Pandora-Secret-Scan-Linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: secretscan-linux
          path: Pandora-Secret-Scan-Linux.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------
  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: secretscan-*
          merge-multiple: true
          path: release-files

      - name: Dateien anzeigen
        run: ls -lh release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
